[build]
  command = "npm run build"
  publish = "out"
  ignore = "if [ $CACHED_COMMIT_REF == $COMMIT_REF ]; then (exit 1); else git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ../..; fi;"

# Netlify's Next.js Runtime will handle caching but won't generate any functions for SSR support
# https://github.com/netlify/next-runtime/blob/main/README.md#use-with-next-export
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Next.js 16 needs Node 20.9+; pin an LTS so builds don't depend on the site default.
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Removed pages, sent to the page that replaced them. Netlify applies a
# redirect without `force` only where the export has no file at `from`, so a
# page that is added back at that address wins. `to` is an address of a page
# in out/, as the site serves it (no `.html`).
#
# The corporate podcasting guide, in English and in Spanish, became the page
# for colleges and universities, which is in English only.
[[redirects]]
  from = "/learn/corporate-podcasting"
  to = "/education"
  status = 301

[[redirects]]
  from = "/es/learn/corporate-podcasting"
  to = "/education"
  status = 301
